<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Cashly</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #F8FAFC;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .pre-splash-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #F8FAFC;
        background-image: radial-gradient(rgba(22, 36, 123, 0.035) 1.5px, transparent 1.5px);
        background-size: 24px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
        z-index: 99999;
      }
      .pre-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 320px;
        width: 100%;
        animation: preSplashFadeIn 0.3s ease-out;
      }
      .pre-splash-logo {
        width: 92px;
        height: 92px;
        border-radius: 28px;
        background: linear-gradient(135deg, #1E3A8A 0%, #16247B 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 36px rgba(22, 36, 123, 0.22), 0 4px 12px rgba(22, 36, 123, 0.12);
        margin-bottom: 22px;
      }
      .pre-splash-title {
        font-size: 34px;
        font-weight: 800;
        color: #0F172A;
        letter-spacing: -0.6px;
        margin-bottom: 8px;
        line-height: 1.15;
      }
      .pre-splash-tagline {
        font-size: 15px;
        font-weight: 500;
        color: #64748B;
        margin-bottom: 36px;
        letter-spacing: -0.1px;
      }
      .pre-splash-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .pre-splash-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #16247B;
        opacity: 0.8;
        animation: preSplashPulse 1.2s infinite ease-in-out;
      }
      .pre-splash-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .pre-splash-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes preSplashFadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes preSplashPulse {
        0%, 80%, 100% { transform: scale(0.65); opacity: 0.3; }
        40% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-splash-container">
        <div class="pre-splash-content">
          <div class="pre-splash-logo">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
              <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
            </svg>
          </div>
          <h1 class="pre-splash-title">Cashly</h1>
          <p class="pre-splash-tagline">Your money, simply managed.</p>
          <div class="pre-splash-dots">
            <div class="pre-splash-dot"></div>
            <div class="pre-splash-dot"></div>
            <div class="pre-splash-dot"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
